name: Unzip and Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip and Fix Code
        run: |
          unzip -o "*.zip"
          sed -i 's/org\.bukkit\.ItemStack/org.bukkit.inventory.ItemStack/g' PrivateBlock/src/main/java/com/example/privateblock/command/PsCommand.java
          python3 -c '
          import re
          p = "PrivateBlock/src/main/java/com/example/privateblock/listener/ExplosionListener.java"
          lines = open(p).readlines()
          lines[19] = re.sub(r"\(([^()]+)\)", r"(\1.getLocation())", lines[19], count=1)
          open(p, "w").writelines(lines)
          print("Fixed line 20:", lines[19])
          '

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build with Maven
        run: |
          cd PrivateBlock
          mvn package

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: SparkGuards-Plugin
          path: PrivateBlock/target/*.jar
